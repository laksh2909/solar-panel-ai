# Solar Panel Fault Detection Configuration

project:
  name: "solar-panel-fault-detection"
  version: "1.0.0"
  seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  split_ratios:
    train: 0.60
    val: 0.20
    test: 0.20
  image_size: [224, 224] # [Height, Width]
  channels: 3
  classes:
    - "Bird-drop"
    - "Clean"
    - "Dusty"
    - "Electrical-damage"
    - "Physical-damage"
    - "Snow-Covered"

preprocessing:
  augmentation:
    horizontal_flip_p: 0.5
    vertical_flip_p: 0.3
    random_rotate_degrees: 15
    random_rotate_p: 0.5
    brightness_contrast_p: 0.4
    color_jitter_p: 0.3
    motion_blur_p: 0.2
    gaussian_noise_p: 0.2
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

models:
  target_model: "sparknet"
  available_models:
    - "sparknet"
    - "squeezenet1_1"
    - "mobilenet_v2"
    - "resnet18"
  num_classes: 6
  dropout_rate: 0.3

training:
  batch_size: 16
  num_workers: 0 # Windows safe default
  epochs: 20
  learning_rate: 0.001
  min_lr: 0.00001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  label_smoothing: 0.05
  early_stopping_patience: 7
  checkpoint_dir: "models/checkpoints"
  use_amp: false # CPU fallback safe

evaluation:
  metrics_dir: "results/metrics"
  plots_dir: "results/plots"
  predictions_dir: "results/predictions"
